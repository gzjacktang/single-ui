name: Publish Linux releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'gzjacktang/single-ui'
    runs-on: ubuntu-24.04
    env:
      CORE_VERSION: 1.13.13
      CORE_TAGS: with_v2ray_api,with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Linux cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build frontend and test panel
        run: |
          npm ci --prefix web
          npm run build --prefix web
          go test ./...

      - name: Build statically linked panel binaries
        run: |
          mkdir -p artifacts
          for architecture in amd64 arm64; do
            if [ "$architecture" = arm64 ]; then
              compiler=aarch64-linux-gnu-gcc
            else
              compiler=gcc
            fi
            GOOS=linux GOARCH="$architecture" CGO_ENABLED=1 CC="$compiler" \
              go build -trimpath -buildvcs=false \
              -ldflags="-s -w -linkmode external -extldflags '-static' -X main.Version=${GITHUB_REF_NAME}" \
              -o "artifacts/slinx_linux_${architecture}" .
            cp "artifacts/slinx_linux_${architecture}" "artifacts/sbox_linux_${architecture}"
          done

      - name: Check for existing sing-box core release
        id: core
        run: |
          if gh release view "sing-box-${CORE_VERSION}" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build sing-box core binaries
        if: steps.core.outputs.publish == 'true'
        run: |
          git clone --depth 1 --branch "v${CORE_VERSION}" \
            https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          for architecture in amd64 arm64; do
            (
              cd "$RUNNER_TEMP/sing-box"
              GOOS=linux GOARCH="$architecture" CGO_ENABLED=0 \
                go build -trimpath -tags "$CORE_TAGS" \
                -ldflags="-s -w -X github.com/sagernet/sing-box/constant.Version=${CORE_VERSION}" \
                -o "$GITHUB_WORKSPACE/artifacts/sing-box_linux_${architecture}" ./cmd/sing-box
            )
            gzip -n -9 "artifacts/sing-box_linux_${architecture}"
          done

      - name: Check release artifacts
        run: |
          for architecture in amd64 arm64; do
            file "artifacts/slinx_linux_${architecture}"
            file "artifacts/sbox_linux_${architecture}"
            if readelf -l "artifacts/slinx_linux_${architecture}" | grep -q INTERP; then
              echo "Panel binary is dynamically linked: ${architecture}" >&2
              exit 1
            fi
          done
          (cd artifacts && sha256sum sbox_linux_* slinx_linux_* > SHA256SUMS)
          if [ "${{ steps.core.outputs.publish }}" = true ]; then
            for architecture in amd64 arm64; do
              gzip -t "artifacts/sing-box_linux_${architecture}.gz"
            done
            (cd artifacts && sha256sum sing-box_linux_*.gz >> SHA256SUMS)
          fi
          cat artifacts/SHA256SUMS

      - name: Publish sing-box core release
        if: steps.core.outputs.publish == 'true'
        run: |
          gh release create "sing-box-${CORE_VERSION}" artifacts/sing-box_linux_*.gz artifacts/SHA256SUMS \
            --target "$GITHUB_SHA" --title "sing-box ${CORE_VERSION}" \
            --notes "Built from SagerNet/sing-box v${CORE_VERSION} with the panel's required build tags." \
            --latest=false

      - name: Publish panel release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/sbox_linux_* artifacts/slinx_linux_* artifacts/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/sbox_linux_* artifacts/slinx_linux_* artifacts/SHA256SUMS \
              --verify-tag --title "SBOX ${GITHUB_REF_NAME}" \
              --notes "SBOX panel for Linux amd64 and arm64. Rebranded panel and management command, with a new logo; removed built-in BBR and IP/unlock/back-route detection. Legacy binary filenames remain available for existing installations." \
              --latest
          fi
